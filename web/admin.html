<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ChapaShop — панель владельца</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/admin.css?v=100">
</head>
<body>
  
  <!-- Форма входа -->
  <div id="login" class="login hidden">
    <form id="loginForm" class="card login-card">
      <div class="logo" style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">Chapa<span style="color:var(--primary)">Shop</span></div>
      <p class="label" style="margin-bottom: 16px;">Панель владельца</p>
      <input name="username" placeholder="Логин" autocomplete="username" required maxlength="64" class="field" style="width:100%; padding:12px; border:1.5px solid var(--border); border-radius:12px; margin-bottom:8px;">
      <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required maxlength="128" class="field" style="width:100%; padding:12px; border:1.5px solid var(--border); border-radius:12px; margin-bottom:16px;">
      <button class="btn btn-primary" style="width: 100%;">Войти</button>
      <p id="loginErr" class="err" style="color: var(--danger); margin-top: 8px; font-size:14px;"></p>
    </form>
  </div>

  <!-- Сама админка -->
  <div id="app" class="hidden">
    
    <!-- ВЕРХНЕЕ МЕНЮ (возвращаем вкладки) -->
    <header class="top-nav" style="display:flex; gap:10px; padding: 16px; background:#fff; box-shadow: var(--shadow); margin-bottom: 24px; overflow-x: auto;">
      <a href="#" class="btn btn-gray" onclick="loadTab('dash'); return false;">Сводка</a>
      <a href="#" class="btn btn-primary" onclick="loadTab('orders'); return false;">Заказы</a>
      <a href="#" class="btn btn-gray" onclick="loadTab('products'); return false;">Товары</a>
      <a href="#" class="btn btn-gray" onclick="loadTab('promos'); return false;">Промокоды</a>
      <a href="#" class="btn btn-gray" onclick="loadTab('customers'); return false;">Покупатели</a>
      <a href="#" class="btn btn-gray" style="margin-left: auto;" id="logout">Выйти</a>
    </header>

    <!-- БЛОК КРАСИВОГО ЗАКАЗА -->
    <div id="view-order" class="page">
      <aside class="card sidebar">
        <div>
          <div class="label">Заказ №</div>
          <h1 class="order-number" id="orderNumber">—</h1>
          <span class="badge" id="orderStatus">—</span>

          <dl class="meta">
            <div><dt>Создан</dt><dd id="orderDate">—</dd></div>
            <div><dt>Roblox username</dt><dd id="robloxUser">—</dd></div>
            <div><dt>Telegram ID</dt><dd id="telegramId">—</dd></div>
          </dl>
        </div>
        <button class="btn btn-outline" id="backBtn">← Назад ко всем заказам</button>
      </aside>

      <main class="content">
        <section class="card">
          <h2 class="card-title">Информация о заказе</h2>
          <div class="table-wrap">
            <table class="items">
              <thead>
                <tr><th>Товар</th><th>Цена</th><th>Кол-во</th><th>Сумма</th></tr>
              </thead>
              <tbody id="itemsBody"></tbody>
            </table>
          </div>
          <div class="total">Итого: <span id="orderTotal">0 ⭐</span></div>
        </section>

        <section class="card">
          <h2 class="card-title">Действия с заказом</h2>
          <div class="actions">
            <button class="btn btn-primary" id="sendLinkBtn">Скинуть ссылку на сервер</button>
            <button class="btn btn-success" id="completeBtn">Отдать заказ</button>
            <button class="btn btn-danger" id="rejectBtn">Отклонить заказ</button>
            <button class="btn btn-gray" id="pdfBtn">Сохранить PDF-чек</button>
          </div>

          <label class="field">
            <span>Ссылка на приватный сервер</span>
            <input type="url" id="serverLink" placeholder="https://www.roblox.com/games/..." />
          </label>

          <label class="checkbox">
            <input type="checkbox" id="notifyTg" checked />
            <span class="checkmark"></span>
            Уведомить покупателя в Telegram
          </label>
        </section>
      </main>
    </div>

    <!-- Сюда будут загружаться другие вкладки (Товары, Промокоды и тд) -->
    <div id="view-other" class="hidden" style="padding: 24px;"></div>

  </div>

  <div class="toast" id="toast"></div>
  <script src="/static/admin.js?v=100"></script>
</body>
</html>
