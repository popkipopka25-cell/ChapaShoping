<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Заказ — Панель администратора</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <!-- ЛЕВАЯ КОЛОНКА -->
    <aside class="card sidebar">
      <div>
        <div class="label">Заказ №</div>
        <h1 class="order-number" id="orderNumber">—</h1>
        <span class="badge" id="orderStatus">—</span>

        <dl class="meta">
          <div><dt>Создан</dt><dd id="orderDate">—</dd></div>
          <div><dt>Roblox username</dt><dd id="robloxUser">—</dd></div>
          <div><dt>Telegram ID</dt><dd id="telegramId">—</dd></div>
        </dl>
      </div>

      <button class="btn btn-outline" id="backBtn">← Назад ко всем заказам</button>
    </aside>

    <!-- ПРАВАЯ КОЛОНКА -->
    <main class="content">
      <section class="card">
        <h2 class="card-title">Информация о заказе</h2>
        <div class="table-wrap">
          <table class="items">
            <thead>
              <tr><th>Товар</th><th>Цена</th><th>Кол-во</th><th>Сумма</th></tr>
            </thead>
            <tbody id="itemsBody"></tbody>
          </table>
        </div>
        <div class="total">Итого: <span id="orderTotal">0 ⭐</span></div>
      </section>

      <section class="card">
        <h2 class="card-title">Действия с заказом</h2>
        <div class="actions">
          <button class="btn btn-primary" id="sendLinkBtn">Скинуть ссылку на сервер</button>
          <button class="btn btn-success" id="completeBtn">Отдать заказ</button>
          <button class="btn btn-danger" id="rejectBtn">Отклонить заказ</button>
          <button class="btn btn-gray" id="pdfBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
            Сохранить PDF-чек
          </button>
        </div>

        <label class="field">
          <span>Ссылка на приватный сервер</span>
          <input type="url" id="serverLink" placeholder="https://www.roblox.com/games/...?privateServerLinkCode=..." />
        </label>

        <label class="checkbox">
          <input type="checkbox" id="notifyTg" checked />
          <span class="checkmark"></span>
          Уведомить покупателя в Telegram
        </label>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
